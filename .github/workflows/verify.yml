name: SpeakEasy Continuous Verification & Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Electron Dependencies
        run: npm --prefix electron ci

      - name: Verify Repository Structure & Security
        run: npm run verify

      - name: Audit Electron Dependencies
        run: npm --prefix electron audit --audit-level=high

      - name: Audit Root Dependencies
        run: npm audit --audit-level=high

      - name: Build Web Application
        run: npm run build

      - name: Stage Windows Application
        run: npm run stage:windows

      - name: Build Windows AppX Package
        run: npm run build:windows

      - name: Generate Package Checksum
        shell: pwsh
        run: ./scripts/verify-appx.ps1 -BuildDirectory ./electron/build

      - name: Upload Microsoft Store Package Candidate
        uses: actions/upload-artifact@v4
        with:
          name: SpeakEasy-Microsoft-Store-Candidate
          path: |
            electron/build/*.appx
            electron/build/*.sha256
          if-no-files-found: error
          retention-days: 30
