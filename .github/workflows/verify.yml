name: SpeakEasy Continuous Verification & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Electron Dependencies
        run: npm --prefix electron ci

      - name: Verify Repository Structure & Security
        run: npm run verify

      - name: Build Web Application
        run: npm run build

      - name: Stage Windows Application
        run: npm run stage:windows

      - name: Build Windows AppX/MSIX Package
        run: npm run build:windows

      - name: Generate Package Checksum
        run: |
          Get-FileHash -Algorithm SHA256 (Get-ChildItem -Path electron/build/*.appx) | Format-List
