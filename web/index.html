<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://huggingface.co https://cdn-lfs.huggingface.co https://*.huggingface.co; font-src 'self' data:;" />
  <meta name="theme-color" content="#0a0b0d" />
  <title>SpeakEasy — On-Device Voice Dictation</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/wake-emblem-original.png" type="image/png" />

  <style>
    :root {
      --bg-dark: #0a0b0d;
      --bg-card: #121418;
      --bg-input: #1a1d24;
      --border-gold: rgba(212, 175, 55, 0.35);
      --gold-primary: #d4af37;
      --gold-hover: #f3e5ab;
      --gold-active: #aa8c2c;
      --text-main: #f5f0eb;
      --text-muted: #a09a90;
      --accent-red: #c0392b;
      --accent-green: #27ae60;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      line-height: 1.5;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Art Deco Header */
    header {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .brand-badge {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      padding: 3px;
      background: #000;
    }

    .brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold-primary);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .status-badge {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--border-gold);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold-primary);
    }

    .status-badge.live .status-dot {
      background: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Restore Banner */
    .restore-banner {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--gold-primary);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .restore-banner button {
      background: var(--gold-primary);
      color: #000;
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Download Progress Bar */
    .progress-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .progress-bar-bg {
      background: var(--bg-input);
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--gold-primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Main Workspace Card */
    .workspace-card {
      background: var(--bg-card);
      border: 1px solid var(--border-gold);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6);
    }

    /* Control Bar */
    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-record-main {
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-active));
      color: #000;
      border: 2px solid var(--gold-hover);
      padding: 0.8rem 1.75rem;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      transition: all 0.2s ease;
    }

    .btn-record-main:hover {
      background: var(--gold-hover);
      transform: translateY(-1px);
    }

    .btn-record-main:focus-visible {
      outline: 3px solid var(--gold-hover);
      outline-offset: 2px;
    }

    .btn-record-main.listening {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      color: #fff;
      border-color: #ff7979;
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
    }

    .record-timer {
      font-family: monospace;
      font-size: 1.2rem;
      color: var(--gold-primary);
      background: var(--bg-input);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      border: 1px solid var(--border-gold);
    }

    .action-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-action {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-gold);
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-action:hover {
      background: rgba(212, 175, 55, 0.2);
      color: var(--gold-hover);
    }

    .btn-action:focus-visible {
      outline: 2px solid var(--gold-primary);
    }

    /* Editor Box */
    .editor-container {
      position: relative;
    }

    .transcript-editor {
      width: 100%;
      min-height: 280px;
      max-height: 500px;
      overflow-y: auto;
      background: var(--bg-input);
      border: 1px solid var(--border-gold);
      border-radius: 6px;
      padding: 1.25rem;
      font-size: 1.05rem;
      color: var(--text-main);
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .transcript-editor:focus-visible {
      border-color: var(--gold-primary);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    }

    .transcript-editor .interim {
      color: var(--gold-primary);
      font-style: italic;
      border-bottom: 1px dashed var(--gold-primary);
    }

    /* Footer Metadata & Controls */
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(212, 175, 55, 0.15);
    }

    .btn-text-danger {
      background: none;
      border: none;
      color: var(--accent-red);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Confirmation Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      background: var(--bg-card);
      border: 2px solid var(--gold-primary);
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }
  </style>

  <!-- Locally Bundled Transformers.js -->
  <script src="./vendor/transformers/transformers.min.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Art Deco Header -->
    <header>
      <div class="brand-group">
        <div class="brand-badge">
          <img src="./assets/wake-emblem-original.png" alt="SpeakEasy Emblem" />
        </div>
        <div>
          <h1 class="brand-title">SpeakEasy</h1>
          <div class="brand-subtitle">Private On-Device Dictation</div>
        </div>
      </div>
      <div class="status-badge" id="statusBadge" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <!-- Restore Unsaved Draft Banner -->
    <div class="restore-banner" id="restoreBanner" hidden>
      <span>An unsaved draft from a previous session was recovered.</span>
      <div>
        <button id="btnRestore">Restore Draft</button>
        <button id="btnDismissRestore" style="background:none; color:var(--text-muted); border:1px solid var(--border-gold);">Dismiss</button>
      </div>
    </div>

    <!-- Download / Engine Load Progress -->
    <div class="progress-wrap" id="progressWrap" hidden>
      <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
        <span id="progressLabel">Downloading Whisper Model…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>

    <!-- Main Dictation Workspace -->
    <main class="workspace-card">
      <div class="control-bar">
        <button class="btn-record-main" id="btnMic" aria-label="Start listening" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <span id="btnMicLabel">Dictate</span>
        </button>

        <div class="record-timer" id="recordTimer">00:00</div>

        <div class="action-group">
          <button class="btn-action" id="btnCopy">Copy</button>
          <button class="btn-action" id="btnSave">Save TXT</button>
          <button class="btn-action" id="btnClear">Clear</button>
          <button class="btn-action" id="btnNewSession">New Session</button>
        </div>
      </div>

      <!-- Editable Transcript Box -->
      <div class="editor-container">
        <div class="transcript-editor" id="transcriptEditor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Transcript workspace" data-placeholder="Tap Dictate or start typing your transcript here…"></div>
      </div>

      <!-- Footer Info -->
      <div class="meta-bar">
        <div>
          <span id="wordCount">0 words</span> | <span id="charCount">0 chars</span>
        </div>
        <button class="btn-text-danger" id="btnDeleteLocalData">Delete Local Cache</button>
      </div>
    </main>
  </div>

  <!-- Clear / New Session Confirmation Modal -->
  <div class="modal-overlay" id="confirmModal" hidden>
    <div class="modal-card">
      <h3 style="color:var(--gold-primary);">Clear Unsaved Transcript?</h3>
      <p id="confirmModalText">You have unsaved text in your transcript. Are you sure you want to clear it?</p>
      <div class="modal-actions">
        <button class="btn-action" id="btnConfirmCancel">Cancel</button>
        <button class="btn-action" id="btnConfirmOk" style="background:var(--accent-red); color:#fff; border:none;">Clear Transcript</button>
      </div>
    </div>
  </div>

  <script src="./app.js" type="module"></script>
</body>
</html>
