<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>SpeakEasy</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#080a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./assets/wake-emblem-original.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #080a0e;
  --dark: #0d1117;
  --surface: #111820;
  --card: #141c26;
  --border: rgba(255,255,255,0.08);
  --teal: #00d4c8;
  --teal2: #00a89e;
  --teal-soft: rgba(0,212,200,0.14);
  --cream: #f0ead8;
  --cream2: #c8bfa8;
  --muted: #6b7a8d;
  --danger: #ff4757;
  --font-display: "Playfair Display", Georgia, serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(900px 420px at 50% -10%, rgba(0,212,200,0.12), transparent 55%),
    radial-gradient(700px 400px at 100% 100%, rgba(0,168,158,0.08), transparent 50%),
    var(--black);
  color: var(--cream2);
  font-family: var(--font-body);
  line-height: 1.5;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
.app {
  height: 100%;
  max-width: 720px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  padding: calc(16px + var(--safe-t)) 18px calc(16px + var(--safe-b));
  gap: 12px;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
.brand h1 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(1.6rem, 5vw, 2.1rem);
  color: var(--cream);
  letter-spacing: -0.02em;
}
.brand .tag {
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--teal);
  white-space: nowrap;
}
.status {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--muted);
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: rgba(13,17,23,0.7);
  white-space: nowrap;
}
.status.live { color: var(--teal); border-color: rgba(0,212,200,0.35); background: var(--teal-soft); }
.status.err { color: var(--danger); border-color: rgba(255,71,87,0.35); }
.load {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  padding: 10px 12px;
}
.load-label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--muted);
  margin-bottom: 8px;
}
.load-track {
  height: 6px;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
  overflow: hidden;
}
.load-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--teal2), var(--teal));
  transition: width .2s ease;
}
.panel {
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(20,28,38,0.95), rgba(13,17,23,0.92));
  overflow: hidden;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  justify-content: space-between;
}
.toolbar .note {
  font-size: 0.78rem;
  color: var(--muted);
}
a.landing {
  color: var(--teal);
  text-decoration: none;
  font-size: 0.8rem;
}
.transcript {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 18px;
  font-size: 1.05rem;
  color: var(--cream);
  white-space: pre-wrap;
  word-break: break-word;
}
.transcript:empty::before {
  content: "Tap the mic and speak. Your words show up here.";
  color: var(--muted);
}
.interim { color: var(--teal); opacity: 0.85; }
.meta {
  padding: 10px 18px 14px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}
.controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
}
.side-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.side-actions.right { align-items: end; }
.side-actions.left { align-items: start; }
.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--cream2);
  border-radius: 12px;
  padding: 10px 12px;
  cursor: pointer;
}
.btn:hover { border-color: rgba(0,212,200,0.35); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.mic-wrap { display: grid; place-items: center; position: relative; }
.mic {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #2bfff3, var(--teal) 45%, var(--teal2));
  color: var(--black);
  box-shadow: 0 0 0 0 rgba(0,212,200,0.35), 0 18px 40px rgba(0,0,0,0.45);
  display: grid;
  place-items: center;
}
.mic svg { width: 34px; height: 34px; }
.mic.listening {
  animation: pulse 1.4s ease-out infinite;
  background: radial-gradient(circle at 35% 30%, #ff8a95, var(--danger) 55%, #b91c1c);
  color: #fff;
}
.ring {
  position: absolute;
  width: 118px;
  height: 118px;
  border-radius: 50%;
  border: 1px solid rgba(0,212,200,0.25);
  pointer-events: none;
  opacity: 0;
}
.mic.listening + .ring { opacity: 1; animation: ring 1.4s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,71,87,0.45), 0 18px 40px rgba(0,0,0,0.45); }
  70% { box-shadow: 0 0 0 22px rgba(255,71,87,0), 0 18px 40px rgba(0,0,0,0.45); }
  100% { box-shadow: 0 0 0 0 rgba(255,71,87,0), 0 18px 40px rgba(0,0,0,0.45); }
}
@keyframes ring {
  0% { transform: scale(0.92); opacity: 0.7; }
  100% { transform: scale(1.2); opacity: 0; }
}
.hint {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>SpeakEasy</h1>
      <span class="tag">voice → text</span>
    </div>
    <div class="status" id="status">Ready</div>
  </header>

  <div class="load" id="loadWrap" hidden>
    <div class="load-label">
      <span>Loading on-device engine</span>
      <span id="engineLabel">Whisper…</span>
    </div>
    <div class="load-track"><div class="load-bar" id="loadBar"></div></div>
  </div>

  <section class="panel" aria-label="Transcript">
    <div class="toolbar">
      <span class="note">English · on-device Whisper (no Netlify)</span>
      <a class="landing" href="./landing.html">Marketing page</a>
    </div>
    <div class="transcript" id="transcript" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Transcript editor"></div>
    <div class="meta">
      <span id="wordCount">0 words</span>
      <span id="engineLabelMeta">Whisper tiny.en</span>
    </div>
  </section>

  <footer class="controls">
    <div class="side-actions left">
      <button class="btn" id="btnCopy" type="button">Copy</button>
      <button class="btn" id="btnClear" type="button">Clear</button>
    </div>
    <div class="mic-wrap">
      <button class="mic" id="btnMic" type="button" aria-pressed="false" aria-label="Start listening">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm7 10a1 1 0 0 1 1 1 8 8 0 0 1-7 7.94V21h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-1.06A8 8 0 0 1 4 12a1 1 0 0 1 2 0 6 6 0 0 0 12 0 1 1 0 0 1 1-1z"/></svg>
      </button>
      <div class="ring" aria-hidden="true"></div>
    </div>
    <div class="side-actions right">
      <button class="btn" id="btnSave" type="button">Save .txt</button>
      <button class="btn" id="btnStop" type="button" disabled>Stop</button>
    </div>
    <p class="hint" id="hint">First run downloads a small model (~40MB), then caches it. Keep talking — it chunks on pauses.</p>
  </footer>
</div>

<!-- kept for compatibility -->
<select id="lang" hidden></select>
<select id="mode" hidden></select>

<script type="module" src="./app.js"></script>
</body>
</html>
