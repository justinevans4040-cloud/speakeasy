<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>SpeakEasy</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#080a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./assets/wake-emblem-original.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #080a0e;
  --dark: #0d1117;
  --surface: #111820;
  --card: #141c26;
  --border: rgba(255,255,255,0.08);
  --teal: #00d4c8;
  --teal2: #00a89e;
  --teal-soft: rgba(0,212,200,0.14);
  --cream: #f0ead8;
  --cream2: #c8bfa8;
  --muted: #6b7a8d;
  --danger: #ff4757;
  --font-display: "Playfair Display", Georgia, serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background:
    radial-gradient(900px 420px at 50% -10%, rgba(0,212,200,0.12), transparent 55%),
    radial-gradient(700px 400px at 100% 100%, rgba(0,168,158,0.08), transparent 50%),
    var(--black);
  color: var(--cream2);
  font-family: var(--font-body);
  line-height: 1.5;
  overflow: hidden;
}
button, select { font: inherit; color: inherit; }
.app {
  height: 100%;
  max-width: 720px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: calc(16px + var(--safe-t)) 18px calc(16px + var(--safe-b));
  gap: 14px;
}
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
.brand h1 {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(1.6rem, 5vw, 2.1rem);
  color: var(--cream);
  letter-spacing: -0.02em;
}
.brand .tag {
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--teal);
  white-space: nowrap;
}
.status {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--muted);
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: rgba(13,17,23,0.7);
  white-space: nowrap;
}
.status.live { color: var(--teal); border-color: rgba(0,212,200,0.35); background: var(--teal-soft); }
.status.err { color: var(--danger); border-color: rgba(255,71,87,0.35); }

.panel {
  min-height: 0;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(20,28,38,0.95), rgba(13,17,23,0.92));
  overflow: hidden;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  align-items: center;
}
.toolbar select {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 10px;
  min-width: 0;
  flex: 1 1 160px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  user-select: none;
}
.chip input { accent-color: var(--teal); }
.transcript {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 18px;
  font-size: 1.05rem;
  color: var(--cream);
  white-space: pre-wrap;
  word-break: break-word;
}
.transcript:empty::before {
  content: "Tap the mic and speak. Your words show up here.";
  color: var(--muted);
}
.interim { color: var(--teal); opacity: 0.85; }
.meta {
  padding: 10px 18px 14px;
  border-top: 1px solid var(--border);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
}
.side-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.side-actions.right { align-items: end; }
.side-actions.left { align-items: start; }
.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--cream2);
  border-radius: 12px;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .1s;
}
.btn:hover { border-color: rgba(0,212,200,0.35); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.mic-wrap { display: grid; place-items: center; position: relative; }
.mic {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #2bfff3, var(--teal) 45%, var(--teal2));
  color: var(--black);
  box-shadow: 0 0 0 0 rgba(0,212,200,0.35), 0 18px 40px rgba(0,0,0,0.45);
  display: grid;
  place-items: center;
  transition: transform .15s, box-shadow .2s;
}
.mic svg { width: 34px; height: 34px; }
.mic:hover { transform: translateY(-1px); }
.mic.listening {
  animation: pulse 1.4s ease-out infinite;
  background: radial-gradient(circle at 35% 30%, #ff8a95, var(--danger) 55%, #b91c1c);
  color: #fff;
}
.ring {
  position: absolute;
  width: 118px;
  height: 118px;
  border-radius: 50%;
  border: 1px solid rgba(0,212,200,0.25);
  pointer-events: none;
  opacity: 0;
}
.mic.listening + .ring { opacity: 1; animation: ring 1.4s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,71,87,0.45), 0 18px 40px rgba(0,0,0,0.45); }
  70% { box-shadow: 0 0 0 22px rgba(255,71,87,0), 0 18px 40px rgba(0,0,0,0.45); }
  100% { box-shadow: 0 0 0 0 rgba(255,71,87,0), 0 18px 40px rgba(0,0,0,0.45); }
}
@keyframes ring {
  0% { transform: scale(0.92); opacity: 0.7; }
  100% { transform: scale(1.2); opacity: 0; }
}
.hint {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
}
.unsupported {
  margin: auto;
  max-width: 420px;
  text-align: center;
  padding: 28px 18px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--card);
}
.unsupported h2 { font-family: var(--font-display); color: var(--cream); margin-bottom: 8px; }
.unsupported p { color: var(--muted); }
a.landing {
  color: var(--teal);
  text-decoration: none;
  font-size: 0.8rem;
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>SpeakEasy</h1>
      <span class="tag">voice → text</span>
    </div>
    <div class="status" id="status">Ready</div>
  </header>

  <section class="panel" aria-label="Transcript">
    <div class="toolbar">
      <select id="lang" aria-label="Language"></select>
      <label class="chip"><input type="checkbox" id="continuous" checked> Continuous</label>
      <label class="chip"><input type="checkbox" id="interim" checked> Live words</label>
      <a class="landing" href="./landing.html">Marketing page</a>
    </div>
    <div class="transcript" id="transcript" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Transcript editor"></div>
    <div class="meta">
      <span id="wordCount">0 words</span>
      <span id="engineLabel">Web Speech</span>
    </div>
  </section>

  <footer class="controls">
    <div class="side-actions left">
      <button class="btn" id="btnCopy" type="button">Copy</button>
      <button class="btn" id="btnClear" type="button">Clear</button>
    </div>
    <div class="mic-wrap">
      <button class="mic" id="btnMic" type="button" aria-pressed="false" aria-label="Start listening">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm7 10a1 1 0 0 1 1 1 8 8 0 0 1-7 7.94V21h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-1.06A8 8 0 0 1 4 12a1 1 0 0 1 2 0 6 6 0 0 0 12 0 1 1 0 0 1 1-1z"/></svg>
      </button>
      <div class="ring" aria-hidden="true"></div>
    </div>
    <div class="side-actions right">
      <button class="btn" id="btnSave" type="button">Save .txt</button>
      <button class="btn" id="btnStop" type="button" disabled>Stop</button>
    </div>
    <p class="hint" id="hint">Hold focus in the transcript to edit. Mic uses on-device speech recognition when available.</p>
  </footer>
</div>

<script>
(function () {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const statusEl = document.getElementById("status");
  const transcriptEl = document.getElementById("transcript");
  const wordCountEl = document.getElementById("wordCount");
  const langEl = document.getElementById("lang");
  const continuousEl = document.getElementById("continuous");
  const interimEl = document.getElementById("interim");
  const btnMic = document.getElementById("btnMic");
  const btnStop = document.getElementById("btnStop");
  const btnCopy = document.getElementById("btnCopy");
  const btnClear = document.getElementById("btnClear");
  const btnSave = document.getElementById("btnSave");
  const hintEl = document.getElementById("hint");

  let recognition = null;
  let listening = false;
  let finalText = "";
  let restarting = false;

  const langs = [
    ["en-US", "English (US)"],
    ["en-GB", "English (UK)"],
    ["es-ES", "Spanish"],
    ["fr-FR", "French"],
    ["de-DE", "German"],
    ["pt-BR", "Portuguese (BR)"],
    ["it-IT", "Italian"],
    ["ja-JP", "Japanese"],
    ["zh-CN", "Chinese (Simplified)"],
  ];
  for (const [code, label] of langs) {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = label;
    langEl.appendChild(opt);
  }
  const savedLang = localStorage.getItem("speakeasy.lang");
  if (savedLang) langEl.value = savedLang;

  function setStatus(text, mode) {
    statusEl.textContent = text;
    statusEl.classList.toggle("live", mode === "live");
    statusEl.classList.toggle("err", mode === "err");
  }

  function countWords(text) {
    const t = text.trim();
    if (!t) return 0;
    return t.split(/\s+/).length;
  }

  function render(interim) {
    const interimHtml = interim
      ? '<span class="interim">' + escapeHtml(interim) + "</span>"
      : "";
    // Keep caret friendly: only rewrite when not focused editing mid-stream final block
    const plain = finalText + (interim ? (finalText && !/\s$/.test(finalText) ? " " : "") + interim : "");
    if (document.activeElement === transcriptEl && !listening) {
      wordCountEl.textContent = countWords(transcriptEl.innerText) + " words";
      return;
    }
    transcriptEl.innerHTML = escapeHtml(finalText) + (interim ? (finalText ? " " : "") + interimHtml : "");
    wordCountEl.textContent = countWords(plain) + " words";
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }

  function escapeHtml(s) {
    return s
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function syncFinalFromEditor() {
    // Strip interim spans if user edited
    finalText = transcriptEl.innerText.replace(/\u00a0/g, " ");
  }

  function unsupported() {
    document.getElementById("app").innerHTML =
      '<div class="unsupported"><h2>SpeakEasy</h2><p>This browser cannot use speech recognition. Open in Chrome or Edge on desktop, or the Android app WebView.</p></div>';
  }

  if (!SpeechRecognition) {
    unsupported();
    return;
  }

  function createRecognition() {
    const rec = new SpeechRecognition();
    rec.lang = langEl.value || "en-US";
    rec.continuous = !!continuousEl.checked;
    rec.interimResults = !!interimEl.checked;
    rec.maxAlternatives = 1;

    rec.onstart = function () {
      listening = true;
      restarting = false;
      btnMic.classList.add("listening");
      btnMic.setAttribute("aria-pressed", "true");
      btnMic.setAttribute("aria-label", "Stop listening");
      btnStop.disabled = false;
      setStatus("Listening", "live");
      hintEl.textContent = "Listening… speak naturally. Tap the mic or Stop when done.";
    };

    rec.onerror = function (event) {
      const err = event.error || "error";
      if (err === "aborted" || err === "no-speech") {
        setStatus(err === "no-speech" ? "No speech" : "Ready");
        return;
      }
      if (err === "not-allowed") {
        setStatus("Mic blocked", "err");
        hintEl.textContent = "Microphone permission denied. Allow mic access and try again.";
        stopListening(false);
        return;
      }
      setStatus(err, "err");
    };

    rec.onend = function () {
      listening = false;
      btnMic.classList.remove("listening");
      btnMic.setAttribute("aria-pressed", "false");
      btnMic.setAttribute("aria-label", "Start listening");
      btnStop.disabled = true;
      render("");
      if (restarting) {
        restarting = false;
        startListening();
        return;
      }
      if (continuousEl.checked && recognition === rec && btnMic.dataset.want === "1") {
        // Chrome ends continuous sessions periodically — auto-resume while user wants listening
        try { rec.start(); } catch (_) { setStatus("Ready"); btnMic.dataset.want = "0"; }
        return;
      }
      btnMic.dataset.want = "0";
      setStatus("Ready");
      hintEl.textContent = "Hold focus in the transcript to edit. Mic uses on-device speech recognition when available.";
    };

    rec.onresult = function (event) {
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        const text = result[0].transcript;
        if (result.isFinal) {
          finalText = (finalText + (finalText && !/\s$/.test(finalText) ? " " : "") + text.trim()).replace(/\s+/g, " ");
          if (finalText && !/[.!?]$/.test(finalText)) {
            // keep flowing; user can punctuate by voice ("question mark") on supporting engines
          }
          interim = "";
        } else {
          interim += text;
        }
      }
      render(interim.trim());
    };

    return rec;
  }

  function startListening() {
    try {
      syncFinalFromEditor();
      if (recognition) {
        try { recognition.abort(); } catch (_) {}
      }
      recognition = createRecognition();
      btnMic.dataset.want = "1";
      recognition.start();
    } catch (e) {
      setStatus("Start failed", "err");
      hintEl.textContent = String(e && e.message ? e.message : e);
    }
  }

  function stopListening(clearWant) {
    if (clearWant !== false) btnMic.dataset.want = "0";
    if (!recognition) return;
    try { recognition.stop(); } catch (_) {
      try { recognition.abort(); } catch (__) {}
    }
  }

  btnMic.addEventListener("click", function () {
    if (listening || btnMic.dataset.want === "1") stopListening(true);
    else startListening();
  });
  btnStop.addEventListener("click", function () { stopListening(true); });

  langEl.addEventListener("change", function () {
    localStorage.setItem("speakeasy.lang", langEl.value);
    if (listening) {
      restarting = true;
      stopListening(false);
      btnMic.dataset.want = "1";
    }
  });
  continuousEl.addEventListener("change", function () {
    if (listening) {
      restarting = true;
      stopListening(false);
      btnMic.dataset.want = "1";
    }
  });
  interimEl.addEventListener("change", function () {
    if (listening) {
      restarting = true;
      stopListening(false);
      btnMic.dataset.want = "1";
    }
  });

  btnCopy.addEventListener("click", async function () {
    syncFinalFromEditor();
    const text = transcriptEl.innerText.trim();
    try {
      await navigator.clipboard.writeText(text);
      setStatus("Copied");
      setTimeout(function () { if (!listening) setStatus("Ready"); }, 900);
    } catch (_) {
      setStatus("Copy failed", "err");
    }
  });

  btnClear.addEventListener("click", function () {
    finalText = "";
    transcriptEl.innerHTML = "";
    wordCountEl.textContent = "0 words";
    setStatus("Cleared");
    setTimeout(function () { if (!listening) setStatus("Ready"); }, 700);
  });

  btnSave.addEventListener("click", function () {
    syncFinalFromEditor();
    const text = transcriptEl.innerText.trim();
    const blob = new Blob([text + "\n"], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
    a.href = url;
    a.download = "speakeasy-" + stamp + ".txt";
    a.click();
    URL.revokeObjectURL(url);
  });

  transcriptEl.addEventListener("input", function () {
    if (!listening) {
      finalText = transcriptEl.innerText;
      wordCountEl.textContent = countWords(finalText) + " words";
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function () {});
    });
  }
})();
</script>
</body>
</html>
